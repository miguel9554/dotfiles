set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind L select-window -l

# Resize panes using Shift + vim keys
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# previous
bind P last-window

# since version 1.9 this is needed https://unix.stackexchange.com/a/12091
# source https://unix.stackexchange.com/a/118381
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c "#{pane_current_path}"

set -g mouse on

# Vim-like copy mode:
# Ctrl+b [  -> enter copy mode
# v         -> start visual selection
# y         -> yank selection to system clipboard and exit
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter send-keys -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi Escape send-keys -X cancel

# Mouse selection also copies to system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

set -g allow-passthrough on
